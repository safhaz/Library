<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Admin</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#1b2a24; --muted:#5d6b64; --line:#e3e7e1; --paper:#f6f4ee; --card:#fff;
    --brand:#1d3a2f; --brand-2:#2f5d4a;
    --ok:#1f7a4d; --ok-bg:#e7f4ec; --warn:#9a5b00; --warn-bg:#fdf1de; --err:#a3302a; --err-bg:#fbe9e7; --info:#2d5a8a; --info-bg:#e8f0f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .btn{padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:550;white-space:nowrap}
  a.btn{text-decoration:none;color:var(--ink);display:inline-block}
  .btn:hover{border-color:#c9d0c7}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input[type=text],input[type=email],input[type=password],input[type=search],select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;outline:none}
  input:focus,select:focus{border-color:var(--brand-2)}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(27,42,36,.08)}
  .login-card h1{margin:0 0 4px;font-size:22px}
  .login-card p{margin:0 0 20px;color:var(--muted)}
  .login-card label{display:block;font-weight:600;margin:12px 0 6px}
  .login-card input{width:100%}
  .login-card .btn{width:100%;margin-top:18px;padding:12px}
  .msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:9px;display:none}
  .msg.err{display:block;background:var(--err-bg);color:var(--err)}

  /* app */
  #app{display:none}
  .top{background:var(--brand);color:#fff}
  .top .wrap{display:flex;align-items:center;gap:14px;padding:14px 22px;max-width:1680px;margin:0 auto}
  .top h1{font-size:18px;margin:0;font-weight:650}
  .top .sp{flex:1}
  .top .who{opacity:.75;font-size:13px}
  .top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
  .wrap-main{max-width:1680px;margin:0 auto;padding:20px 22px 60px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
  .stat .k{font-size:12.5px;color:var(--muted);font-weight:550}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.alert .v{color:var(--err)}
  .tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:14px;overflow-x:auto}
  .tab{padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
  .tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
  .tab .c{font-size:12px;background:#eceeea;border-radius:99px;padding:1px 7px;margin-left:5px;color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:200px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scroll{overflow:auto;max-height:calc(100vh - 330px);min-height:240px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:#f7f8f5;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
  td{padding:10px 12px;border-bottom:1px solid #f0f2ee;vertical-align:top}
  td:nth-child(2){min-width:190px}
  tr:hover td{background:#fafbf9}
  td.nowrap{white-space:nowrap}
  .sub{font-size:12.5px;color:var(--muted)}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.err{background:var(--err-bg);color:var(--err)}
  .chip.info{background:var(--info-bg);color:var(--info)}
  .chip.mute{background:#eceeea;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .add{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .add.open{display:block}
  .add .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
  .add input,.add select{width:100%}
  .qr-wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px;padding:22px;align-items:start}
  @media (max-width:760px){.qr-wrap{grid-template-columns:1fr}}
  .qr-box{border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;background:#fff}
  .qr-box svg,.qr-box img{width:100%;height:auto;max-width:300px}
  .qr-box .cap{font-weight:650;margin-top:8px}
  .url{word-break:break-all;background:#f7f8f5;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .drop{display:block;border:2px dashed #c9d0c7;border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:#fafbf8}
  .drop.over,.drop:hover{border-color:var(--brand-2);background:#eef4f0}
  .upcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  details summary{cursor:pointer}
  input[type=date]{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit}
  .modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;place-items:center;padding:20px;z-index:10}
  .modal.open{display:grid}
  .modal .box{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20}
  @media print{
    body *{visibility:hidden}
    .printable,.printable *{visibility:visible}
    .printable{position:absolute;left:0;top:0;width:100%}
  }
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm">
    <h1>Library Admin</h1>
    <p id="loginSub">Sign in to see all library activity.</p>
    <label for="lemail">Email</label>
    <input type="email" id="lemail" autocomplete="username" required>
    <label for="lpass">Password</label>
    <input type="password" id="lpass" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="lbtn">Sign in</button>
    <div class="msg" id="lmsg"></div>
  </form>
</section>

<section id="app">
  <div class="top"><div class="wrap">
    <h1 id="title">Library Admin</h1>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn small" id="refresh">Refresh</button>
    <button class="btn small" id="logout">Sign out</button>
  </div></div>

  <div class="wrap-main">
    <div class="stats" id="stats"></div>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="report" aria-selected="true">Report (tblTransactions)<span class="c" id="c-report"></span></button>
      <button class="tab" role="tab" data-tab="activity">Activity<span class="c" id="c-activity"></span></button>
      <button class="tab" role="tab" data-tab="books">Books<span class="c" id="c-books"></span></button>
      <button class="tab" role="tab" data-tab="people">Employees<span class="c" id="c-people"></span></button>
      <button class="tab" role="tab" data-tab="emails">Emails<span class="c" id="c-emails"></span></button>
      <button class="tab" role="tab" data-tab="upload">Upload Excel</button>
      <button class="tab" role="tab" data-tab="settings">Settings</button>
      <button class="tab" role="tab" data-tab="qr">QR code</button>
    </div>

    <div id="view"></div>
  </div>
</section>

<div class="modal" id="modal"><div class="box printable" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(() => {
  const C = window.LIBRARY_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = (d, time = true) => d ? new Date(d).toLocaleString("en-GB", time ? { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" } : { day:"numeric", month:"short", year:"numeric" }) : "";
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2600); };

  document.title = (C.LIBRARY_NAME || "Library") + " – Admin";
  $("title").textContent = (C.LIBRARY_NAME || "Library") + " · Admin";

  const configured = C.SUPABASE_URL && !/YOUR-PROJECT/.test(C.SUPABASE_URL) && C.SUPABASE_ANON_KEY && !/PASTE/.test(C.SUPABASE_ANON_KEY);
  if (!configured) {
    $("loginSub").innerHTML = "<b>Not connected yet.</b> Open <b>config.js</b> and paste your Supabase URL and anon key.";
    $("lbtn").disabled = true; return;
  }
  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);

  // ---------------- auth ----------------
  async function enter(session) {
    const { data: ok, error } = await sb.rpc("is_admin");
    if (error || !ok) {
      await sb.auth.signOut();
      showLoginError("This account is not an admin. Ask the owner to add your email to the 'admins' table.");
      return;
    }
    $("who").textContent = session.user.email;
    $("login").style.display = "none"; $("app").style.display = "block";
    loadAll();
  }
  function showLoginError(t) { const m = $("lmsg"); m.className = "msg err"; m.textContent = t; }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("lbtn").disabled = true; $("lmsg").className = "msg";
    const { data, error } = await sb.auth.signInWithPassword({ email: $("lemail").value.trim(), password: $("lpass").value });
    $("lbtn").disabled = false;
    if (error) return showLoginError(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message);
    enter(data.session);
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
  sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); });

  // ---------------- data ----------------
  const S = { books: [], members: [], tx: [], activity: [], emails: [], reservations: [], settings: {}, tab: "report", q: "", filter: "all", showAllStaff: false, from: "", to: "", upload: null };
  const memberBy = () => new Map(S.members.map(m => [m.email, m]));
  const bookBy = () => new Map(S.books.map(b => [b.book_id, b]));

  async function fetchAll(table, order, asc = false) {
    let out = [], from = 0, size = 1000;
    for (;;) {
      const { data, error } = await sb.from(table).select("*").order(order, { ascending: asc }).range(from, from + size - 1);
      if (error) throw error;
      out = out.concat(data); if (data.length < size) break; from += size;
    }
    return out;
  }

  async function loadAll() {
    $("view").innerHTML = '<div class="panel"><div class="empty">Loading…</div></div>';
    try {
      const [books, members, tx, activity, emails, reservations, settings] = await Promise.all([
        fetchAll("books", "title", true), fetchAll("members", "name", true), fetchAll("transactions", "issue_date"),
        fetchAll("activity_log", "created_at"), fetchAll("email_log", "created_at"),
        fetchAll("reservations", "created_at", true), fetchAll("settings", "key", true),
      ]);
      Object.assign(S, { books, members, tx, activity, emails, reservations,
        settings: Object.fromEntries(settings.map(r => [r.key, r.value])) });
      renderStats(); render();
    } catch (e) {
      console.error(e);
      $("view").innerHTML = `<div class="panel"><div class="empty">Could not load data: ${esc(e.message || e)}</div></div>`;
    }
  }
  $("refresh").addEventListener("click", loadAll);

  const isOpen = (t) => !t.return_date;
  const isActiveRes = (r) => r.status === "waiting" || r.status === "notified";
  // Calls the library-action server function as the signed-in admin
  async function adminCall(body) {
    const { data } = await sb.auth.getSession();
    const res = await fetch(C.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/library-action", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + (data.session?.access_token || "") },
      body: JSON.stringify(body),
    });
    return res.json().catch(() => ({ ok: false, message: "No response from server" }));
  }
  const isOverdue = (t) => isOpen(t) && new Date(t.due_date) < new Date();

  function renderStats() {
    const open = S.tx.filter(isOpen), overdue = open.filter(isOverdue);
    const borrowers = new Set(S.tx.filter(t => t.source !== "import" || isOpen(t)).map(t => t.user_email)).size;
    const month = Date.now() - 30 * 864e5;
    const acts = S.activity.filter(a => new Date(a.created_at) > month).length;
    const tiles = [
      ["Books", S.books.filter(b => b.active).length], ["Available", S.books.filter(b => b.active && !open.some(t => t.book_id === b.book_id) && !S.reservations.some(r => r.book_id === b.book_id && isActiveRes(r))).length],
      ["Issued now", open.length], ["Overdue", overdue.length, overdue.length > 0],
      ["In queue", S.reservations.filter(isActiveRes).length], ["Borrowers", borrowers], ["Actions (30 days)", acts],
    ];
    $("stats").innerHTML = tiles.map(([k, v, a]) => `<div class="stat ${a ? "alert" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    $("c-activity").textContent = S.activity.length; $("c-report").textContent = S.tx.length + S.reservations.length; $("c-books").textContent = S.books.length;
    $("c-people").textContent = S.members.filter(m => m.active).length; $("c-emails").textContent = S.emails.length;
  }

  // ---------------- tabs ----------------
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    S.tab = t.dataset.tab; S.q = ""; S.filter = "all"; S.showAllStaff = false; render();
  }));

  const outcomeChip = {
    issued: ["ok", "Issued"], returned: ["ok", "Returned"], already_issued: ["warn", "Already issued"],
    already_returned: ["warn", "Already returned"], no_record: ["warn", "No record"], unknown_user: ["err", "Unknown email"],
    error: ["err", "Error"], admin_return: ["info", "Returned by admin"],
    queued: ["info", "Joined queue"], already_in_queue: ["mute", "Already in queue"], reserved: ["warn", "Reserved for queue"],
    own_book: ["mute", "Already has it"], available_now: ["mute", "Was available"], queue_notified: ["info", "Book held for them"],
    hold_expired: ["warn", "Hold expired"], admin_cancel: ["info", "Removed from queue"], admin_days: ["info", "Loan period changed"],
  };
  const chip = (cls, t) => `<span class="chip ${cls}">${esc(t)}</span>`;
  const match = (row) => !S.q || JSON.stringify(row).toLowerCase().includes(S.q.toLowerCase());

  function toolbar(filters, extra = "") {
    return `<div class="toolbar">
      <input type="search" id="q" placeholder="Search…" value="${esc(S.q)}">
      ${filters ? `<select id="filter">${filters.map(([v, l]) => `<option value="${v}" ${S.filter === v ? "selected" : ""}>${l}</option>`).join("")}</select>` : ""}
      ${extra}
      <button class="btn" id="csv">Export CSV</button>
    </div>`;
  }
  function wireToolbar(rowsForCsv) {
    const q = $("q"); if (q) q.addEventListener("input", () => { S.q = q.value; render(true); });
    const f = $("filter"); if (f) f.addEventListener("change", () => { S.filter = f.value; render(); });
    $("csv").addEventListener("click", () => downloadCsv(rowsForCsv(), `library-${S.tab}-${new Date().toISOString().slice(0,10)}.csv`));
  }
  function table(head, rows, emptyText = "Nothing here yet.") {
    return `<div class="panel"><div class="scroll">${rows.length ? `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>` : `<div class="empty">${emptyText}</div>`}</div></div>`;
  }

  function render(keepFocus) {
    const pos = keepFocus && $("q") ? $("q").selectionStart : null;
    ({ report: viewReport, activity: viewActivity, books: viewBooks, people: viewPeople, emails: viewEmails, upload: viewUpload, settings: viewSettings, qr: viewQr })[S.tab]();
    if (pos !== null && $("q")) { $("q").focus(); $("q").setSelectionRange(pos, pos); }
  }

  // Activity: every form submission
  function viewActivity() {
    const mb = memberBy();
    let rows = S.activity.map(a => ({ ...a, dept: mb.get(a.email)?.department || "" }));
    if (S.filter !== "all") rows = rows.filter(a => a.outcome === S.filter);
    rows = rows.filter(match);
    const filters = [["all", "All outcomes"], ...Object.entries(outcomeChip).map(([k, [, l]]) => [k, l])];
    $("view").innerHTML = toolbar(filters) + table(
      ["When", "Person", "Action", "Book", "Result", "Details"],
      rows.map(a => {
        const [c, l] = outcomeChip[a.outcome] || ["mute", a.outcome];
        return `<tr><td class="nowrap">${fmt(a.created_at)}</td>
          <td>${esc(a.name || "—")}<div class="sub">${esc(a.email)}${a.dept ? " · " + esc(a.dept) : ""}</div></td>
          <td>${a.action === "issue" ? "Issue" : a.action === "return" ? "Return" : esc(a.action)}</td>
          <td>${esc(a.book_title || a.book_id)}<div class="sub">${esc(a.book_id)}</div></td>
          <td>${chip(c, l)}</td><td class="sub">${esc(a.message)}</td></tr>`;
      }), "No actions yet. They appear here as soon as someone uses the scan page.");
    wireToolbar(() => rows.map(a => ({ When: fmt(a.created_at), Name: a.name, Email: a.email, Department: a.dept, Action: a.action, "Book ID": a.book_id, Book: a.book_title, Result: a.outcome, Details: a.message })));
  }

  // Report: same columns as tblTransaction in the Excel workbook
  const xd = (d) => { if (!d) return ""; const x = new Date(d), p = (n) => String(n).padStart(2, "0");
    return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`; };
  const txStatus = (t) => isOverdue(t) ? "Overdue" : isOpen(t) ? "Issued" : t.status;

  function viewReport() {
    const mb = memberBy(), bb = bookBy();
    const who = (e) => mb.get(e) || {};
    const waitingFor = (bookId) => S.reservations.filter(r => r.book_id === bookId && isActiveRes(r)).length;
    // Place in queue for each active reservation
    const pos = new Map();
    const byBook = {};
    S.reservations.filter(isActiveRes).sort((a, b) => a.created_at.localeCompare(b.created_at) || a.id - b.id)
      .forEach(r => { byBook[r.book_id] = (byBook[r.book_id] || 0) + 1; pos.set(r.id, byBook[r.book_id]); });

    const loanRows = S.tx.map(t => { const m = who(t.user_email), bk = bb.get(t.book_id) || {};
      return { kind: "loan", raw: t, key: "T-" + t.id, id: String(t.id), book_id: t.book_id, title: bk.title || t.book_id, theme: bk.theme || "",
        uid: m.user_id || "", name: m.name || "", email: t.user_email, dept: m.department || "",
        action: t.return_date ? "Return a Book" : "Issue a Book", when: t.return_date || t.issue_date,
        issue: t.issue_date, days: t.loan_days, due: t.due_date, ret: t.return_date,
        queue: isOpen(t) ? waitingFor(t.book_id) : "", status: txStatus(t), sort: t.issue_date }; });
    const resStatus = (r) => r.status === "waiting" ? `Waiting (#${pos.get(r.id)} in queue)`
      : r.status === "notified" ? `Held until ${xd(r.hold_until)}` : r.status === "fulfilled" ? "Collected" : r.status === "expired" ? "Hold expired" : "Cancelled";
    const resRows = S.reservations.map(r => { const m = who(r.user_email), bk = bb.get(r.book_id) || {};
      const out = S.tx.find(t => t.book_id === r.book_id && isOpen(t));
      return { kind: "queue", raw: r, key: "Q-" + r.id, id: "Q-" + r.id, book_id: r.book_id, title: bk.title || r.book_id, theme: bk.theme || "",
        uid: m.user_id || "", name: m.name || "", email: r.user_email, dept: m.department || "",
        action: "Join Queue", when: r.created_at, issue: null, days: "", due: isActiveRes(r) && out ? out.due_date : null, ret: null,
        queue: isActiveRes(r) ? "#" + pos.get(r.id) : "", status: resStatus(r), sort: r.created_at }; });

    let rows = [...loanRows, ...resRows];
    if (S.filter === "loans") rows = rows.filter(r => r.kind === "loan");
    if (S.filter === "open") rows = rows.filter(r => r.kind === "loan" && isOpen(r.raw));
    if (S.filter === "overdue") rows = rows.filter(r => r.kind === "loan" && isOverdue(r.raw));
    if (S.filter === "returned") rows = rows.filter(r => r.kind === "loan" && !isOpen(r.raw));
    if (S.filter === "queue") rows = rows.filter(r => r.kind === "queue" && isActiveRes(r.raw));
    if (S.filter === "queue_all") rows = rows.filter(r => r.kind === "queue");
    if (S.from) rows = rows.filter(r => xd(r.sort).slice(0, 10) >= S.from);
    if (S.to) rows = rows.filter(r => xd(r.sort).slice(0, 10) <= S.to);
    rows = rows.filter(r => match({ ...r, raw: undefined })).sort((a, b) => b.sort.localeCompare(a.sort));

    const chipFor = (r) => {
      if (r.kind === "queue") return r.raw.status === "waiting" ? chip("info", r.status) : r.raw.status === "notified" ? chip("warn", r.status)
        : r.raw.status === "fulfilled" ? chip("ok", r.status) : chip("mute", r.status);
      const t = r.raw; return isOverdue(t) ? chip("err", "Overdue") : isOpen(t) ? chip("info", "Issued") : t.status === "Returned" ? chip("ok", "Returned") : chip("mute", t.status);
    };
    const buttons = (r) => r.kind === "loan"
      ? (isOpen(r.raw) ? `<button class="btn small" data-days="${r.raw.id}">Change days</button> <button class="btn small" data-return="${r.raw.id}">Mark returned</button>` : "")
      : (isActiveRes(r.raw) ? `<button class="btn small" data-cancel="${r.raw.id}">Remove</button>` : "");

    $("view").innerHTML = toolbar([["all", "Everything"], ["loans", "Loans only"], ["open", "Still out"], ["overdue", "Overdue"], ["returned", "Returned"],
        ["queue", "Queue – waiting now"], ["queue_all", "Queue – all requests"]],
        `<label class="sub">From <input type="date" id="from" value="${esc(S.from)}"></label>
         <label class="sub">to <input type="date" id="to" value="${esc(S.to)}"></label>`) + table(
      ["Transaction ID", "Book", "User", "Action", "DateTime", "Issue Date", "Loan Days", "Due Date", "Return Date", "Queue", "TransactionStatus", ""],
      rows.map(r => `<tr><td class="nowrap">${esc(r.id)}</td>
        <td>${esc(r.title)}<div class="sub">${esc(r.book_id)}${r.theme ? " · " + esc(r.theme) : ""}</div></td>
        <td>${esc(r.name || "—")}<div class="sub">${esc(r.email)}${r.dept ? " · " + esc(r.dept) : ""}</div></td>
        <td class="nowrap">${esc(r.action)}</td>
        <td class="nowrap">${xd(r.when)}</td><td class="nowrap">${xd(r.issue)}</td>
        <td>${r.days === "" ? "" : esc(r.days)}</td>
        <td class="nowrap">${r.due ? (r.kind === "queue" ? '<span class="sub">back ~</span>' : "") + xd(r.due).slice(0, 10) : ""}</td>
        <td class="nowrap">${xd(r.ret)}</td>
        <td>${r.queue === 0 ? "" : esc(r.queue)}</td>
        <td>${chipFor(r)}</td>
        <td class="nowrap">${buttons(r)}</td></tr>`),
      "No transactions yet. They appear here as soon as someone issues a book.");
    wireToolbar(() => rows.map(r => ({
      "Transaction ID": r.id, "Book ID": r.book_id, "Book": r.title, "Topic": r.theme, "User ID": r.uid, "User Name": r.name,
      "User Email": r.email, "Department": r.dept, "Action": r.action, "DateTime": xd(r.when), "Issue Date": xd(r.issue),
      "Loan Days": r.days, "Due Date": r.due ? xd(r.due).slice(0, 10) : "", "Return Date": xd(r.ret),
      "Queue": r.queue === 0 ? "" : r.queue, "TransactionStatus": r.status })));
    $("csv").textContent = "Download CSV";
    $("from").addEventListener("change", (e) => { S.from = e.target.value; render(); });
    $("to").addEventListener("change", (e) => { S.to = e.target.value; render(); });
    document.querySelectorAll("[data-return]").forEach(b => b.addEventListener("click", () => adminReturn(+b.dataset.return)));
    document.querySelectorAll("[data-days]").forEach(b => b.addEventListener("click", () => openDaysModal(+b.dataset.days)));
    document.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => adminCancel(+b.dataset.cancel)));
  }

  async function adminReturn(id) {
    const t = S.tx.find(x => x.id === id); if (!t) return;
    const b = bookBy().get(t.book_id), m = memberBy().get(t.user_email);
    if (!confirm(`Mark '${b?.title || t.book_id}' as returned by ${m?.name || t.user_email}? (No email is sent to them. If someone is in the queue, they are emailed that it's available.)`)) return;
    const out = await adminCall({ action: "admin_return", transaction_id: id });
    if (!out.ok) return toast("Failed: " + (out.message || "unknown error"));
    toast(out.queue_notified ? "Returned – next in queue emailed: " + out.queue_notified : "Marked as returned"); loadAll();
  }

  async function adminCancel(id) {
    const r = S.reservations.find(x => x.id === id); if (!r) return;
    const b = bookBy().get(r.book_id), m = memberBy().get(r.user_email);
    if (!confirm(`Remove ${m?.name || r.user_email} from the queue for '${b?.title || r.book_id}'?`)) return;
    const out = await adminCall({ action: "admin_cancel", reservation_id: id });
    if (!out.ok) return toast("Failed: " + (out.message || "unknown error"));
    toast(out.queue_notified ? "Removed – next in queue emailed: " + out.queue_notified : "Removed from queue"); loadAll();
  }

  function openDaysModal(id) {
    const t = S.tx.find(x => x.id === id); if (!t) return;
    const b = bookBy().get(t.book_id), m = memberBy().get(t.user_email);
    const issued = new Date(t.issue_date);
    const dueFor = (d) => new Date(issued.getTime() + d * 864e5).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    $("modalBox").innerHTML = `<div style="text-align:left">
      <h3 style="margin:0 0 4px">Loan period</h3>
      <div class="sub" style="margin-bottom:14px">${esc(b?.title || t.book_id)} · ${esc(m?.name || t.user_email)}<br>Issued ${esc(fmt(t.issue_date, false))}</div>
      <label style="font-weight:600">Number of days</label>
      <div style="display:flex;gap:8px;align-items:center;margin:6px 0 4px">
        <input type="number" id="daysIn" min="1" max="365" value="${t.loan_days || 15}" style="width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px">
        <span class="sub">days</span></div>
      <div class="toolbar" style="margin:8px 0">${[7, 15, 21, 30].map(d => `<button class="btn small" data-preset="${d}">${d} days</button>`).join("")}</div>
      <div class="sub" id="dueOut" style="font-size:14px;margin:6px 0 14px"></div>
      <div class="sub" style="margin-bottom:14px">Reminders follow the new date: halfway, the day before, then every 2nd day if overdue.</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="cancelDays">Cancel</button><button class="btn primary" id="saveDays">Save</button></div></div>`;
    const upd = () => { const d = +$("daysIn").value; $("dueOut").innerHTML = d >= 1 && d <= 365 ? `New return date: <b>${esc(dueFor(d))}</b>` : "Enter 1–365 days"; };
    $("daysIn").addEventListener("input", upd); upd();
    document.querySelectorAll("[data-preset]").forEach(x => x.addEventListener("click", () => { $("daysIn").value = x.dataset.preset; upd(); }));
    $("cancelDays").addEventListener("click", () => $("modal").classList.remove("open"));
    $("saveDays").addEventListener("click", async () => {
      const d = +$("daysIn").value; if (!(d >= 1 && d <= 365)) return;
      $("saveDays").disabled = true;
      const out = await adminCall({ action: "admin_days", transaction_id: id, days: d });
      if (!out.ok) { $("saveDays").disabled = false; return toast("Failed: " + (out.message || "unknown error")); }
      $("modal").classList.remove("open"); toast(`Loan period set to ${d} days`); loadAll();

    $("modal").classList.add("open");
  }

    let rows = S.books.map(b => { const t = openBy.get(b.book_id); return { ...b, loan: t, holder: t ? (mb.get(t.user_email)?.name || t.user_email) : "", times: S.tx.filter(x => x.book_id === b.book_id && x.status !== "Closed on import").length,
      queue: S.reservations.filter(r => r.book_id === b.book_id && isActiveRes(r)).length,

      table(["Book", "Theme", "Status", "With", "Due", "In queue", "Times borrowed", ""],

    $("addToggle").addEventListener("click", () => $("addForm").classList.toggle("open"));
    $("addForm").addEventListener("submit", async (e) => {

  // Participants
  function viewPeople() {
    const byEmail = new Map();
    for (const t of S.tx) {
      if (t.status === "Closed on import") continue;
      const p = byEmail.get(t.user_email) || { total: 0, open: 0, overdue: 0, last: null };
      p.total++; if (isOpen(t)) p.open++; if (isOverdue(t)) p.overdue++;
      if (!p.last || t.issue_date > p.last) p.last = t.issue_date;
      byEmail.set(t.user_email, p);
    }
    const acts = new Map(); S.activity.forEach(a => acts.set(a.email, (acts.get(a.email) || 0) + 1));
    let people = S.showAllStaff ? S.members.map(m => m.email) : [...new Set([...byEmail.keys(), ...acts.keys()])];
    const mb = memberBy();
    let rows = people.map(e => { const m = mb.get(e) || {}; const p = byEmail.get(e) || { total: 0, open: 0, overdue: 0, last: null };
      return { email: e, name: m.name || "", dept: m.department || "", id: m.user_id || "", staff: !!m.email, active: m.active, ...p, actions: acts.get(e) || 0 }; });
    if (S.filter === "holding") rows = rows.filter(r => r.open > 0);
    if (S.filter === "overdue") rows = rows.filter(r => r.overdue > 0);
    rows = rows.filter(match).sort((a, b) => (b.last || "").localeCompare(a.last || "") || a.name.localeCompare(b.name));
    $("view").innerHTML = toolbar([["all", "Everyone"], ["holding", "Holding a book"], ["overdue", "Overdue"]],
      `<label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="allStaff" ${S.showAllStaff ? "checked" : ""}> Show all ${S.members.length} staff</label>
       <button class="btn" id="addToggle">+ Add staff member</button>`) +
      `<form class="add" id="addForm"><div class="grid">

        <input type="email" name="email" placeholder="Work email" required>

        <input type="text" name="department" placeholder="Department">
      </div><button class="btn primary" type="submit">Save staff member</button></form>` +
      table(["Person", "Department", "Books borrowed", "Holding now", "Overdue", "Form actions", "Last borrowed"],
        rows.map(r => `<tr><td>${esc(r.name || "—")} ${r.staff ? "" : chip("err", "Not on staff list")}${r.active === false ? chip("mute", "Inactive") : ""}<div class="sub">${esc(r.email)}${r.id ? " · " + esc(r.id) : ""}</div></td>
          <td class="sub">${esc(r.dept)}</td><td>${r.total}</td><td>${r.open || ""}</td><td>${r.overdue ? chip("err", r.overdue) : ""}</td><td>${r.actions || ""}</td>
          <td class="nowrap">${fmt(r.last, false)}</td></tr>`), "No participants yet.");
    wireToolbar(() => rows.map(r => ({ Name: r.name, Email: r.email, "Employee ID": r.id, Department: r.dept, "Books borrowed": r.total, "Holding now": r.open, Overdue: r.overdue, "Form actions": r.actions, "Last borrowed": fmt(r.last, false) })));
    $("allStaff").addEventListener("change", (e) => { S.showAllStaff = e.target.checked; render(); });
    $("addToggle").addEventListener("click", () => $("addForm").classList.toggle("open"));
    $("addForm").addEventListener("submit", async (e) => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); Object.keys(f).forEach(k => f[k] = f[k].trim()); f.email = f.email.toLowerCase();
      const { error } = await sb.from("members").insert(f);
      if (error) return toast(error.code === "23505" ? "That email is already on the staff list" : "Failed: " + error.message);
      toast("Staff member added"); loadAll();
    });

  // ---------------- Upload Excel ----------------
  const norm = (s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const pick = (hdr, names, contains) => {
    for (const n of names) { const i = hdr.indexOf(n); if (i >= 0) return i; }
    if (contains) { const i = hdr.findIndex(h => h.includes(contains)); if (i >= 0) return i; }
    return -1;
  };
  const clean = (v) => String(v ?? "").replace(/\s+/g, " ").trim();

  // Look at the first rows of a sheet and decide whether it's a books list or an employee list
  function detectSheet(name, rows) {
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const hdr = (rows[r] || []).map(norm);
      const isTx = hdr.includes("transactionid") || hdr.includes("action");
      const id = pick(hdr, ["bookid", "bookcode", "bookno"]);
      const title = pick(hdr, ["book", "title", "bookname", "booktitle", "books"]);
      if (!isTx && id >= 0 && title >= 0) {
        return { type: "books", sheet: name, start: r + 1, rows,
          col: { id, title, author: pick(hdr, ["author", "authors", "writer"]), theme: pick(hdr, ["theme", "category", "genre", "section"]) } };
      }
      const email = pick(hdr, ["email", "employeeemail", "useremail", "workemail", "emailaddress"], "email");
      const nm = pick(hdr, ["name", "employeename", "fullname", "username", "staffname"]);
      if (!isTx && id < 0 && email >= 0 && nm >= 0) {
        return { type: "employees", sheet: name, start: r + 1, rows,
          col: { email, name: nm, id: pick(hdr, ["employeeid", "userid", "empid", "staffid", "id"]),
                 dept: pick(hdr, ["department", "dept", "team"]), active: pick(hdr, ["active", "isactive"]) } };
      }
    }
    return null;
  }

  function parseBooks(d) {
    const out = new Map(), skipped = [];
    d.rows.slice(d.start).forEach((r, i) => {
      const book_id = clean(r[d.col.id]), title = clean(r[d.col.title]);
      if (!book_id && !title) return;
      if (!book_id || !title) { skipped.push(`Row ${d.start + i + 1}: missing ${!book_id ? "Book ID" : "book name"}`); return; }
      out.set(book_id, { book_id, title, author: d.col.author >= 0 ? clean(r[d.col.author]) || null : null,
        theme: d.col.theme >= 0 ? clean(r[d.col.theme]) || null : null, active: true });
    });
    return { items: [...out.values()], skipped };
  }

  function parseEmployees(d) {
    const out = new Map(), skipped = [];
    d.rows.slice(d.start).forEach((r, i) => {
      const email = clean(r[d.col.email]).toLowerCase(), name = clean(r[d.col.name]);
      if (!email && !name) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { skipped.push(`Row ${d.start + i + 1}: invalid email "${email}"`); return; }
      if (!name) { skipped.push(`Row ${d.start + i + 1}: missing name`); return; }
      const a = d.col.active >= 0 ? norm(r[d.col.active]) : "yes";
      out.set(email, { email, name, user_id: d.col.id >= 0 ? clean(r[d.col.id]) || null : null,
        department: d.col.dept >= 0 ? clean(r[d.col.dept]) || null : null,
        active: a === "" || ["yes", "y", "true", "1", "active"].includes(a) });
    });
    return { items: [...out.values()], skipped };
  }

  function viewUpload() {
    const U = S.upload;
    let html = `<div class="panel" style="padding:20px">
      <h3 style="margin:0 0 6px">Upload your Excel file</h3>
      <p class="sub" style="font-size:14px;margin:0 0 14px">Upload the <b>books inventory</b> and/or the <b>employees list</b>. They can be in one workbook or two separate files.
        The page finds the right sheets by their column headings:<br>
        • Books: <b>Book ID</b>, <b>Book</b> (or Title), and optionally <b>Author</b> and <b>Theme</b><br>
        • Employees: <b>Employee ID</b> (or User ID), <b>Name</b>, <b>Email</b> (or EmployeeEmail), and optionally <b>Department</b> and <b>Active</b></p>
      <label class="drop" id="drop"><input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
        <b>Click to choose a file</b> or drag it here<div class="sub">.xlsx, .xls or .csv</div></label>`;
    if (U && U.error) html += `<div class="msg err" style="display:block">${esc(U.error)}</div>`;
    if (U && U.found) {
      html += `<p class="sub" style="margin:16px 0 8px">File: <b>${esc(U.file)}</b></p>`;
      for (const f of U.found) {
        const existing = new Set((f.type === "books" ? S.books.map(b => b.book_id) : S.members.map(m => m.email)));
        const key = f.type === "books" ? "book_id" : "email";
        const newOnes = f.items.filter(x => !existing.has(x[key])).length;
        const inFile = new Set(f.items.map(x => x[key]));
        const missing = (f.type === "books" ? S.books.filter(b => b.active && !inFile.has(b.book_id)) : S.members.filter(m => m.active && !inFile.has(m.email))).length;
        const label = f.type === "books" ? "Books" : "Employees";
        const cols = f.type === "books" ? ["book_id", "title", "author", "theme"] : ["user_id", "name", "email", "department"];
        html += `<div class="upcard">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px">${label}</b>
            <span class="sub">sheet “${esc(f.sheet)}”</span>
            ${chip("ok", f.items.length + " rows")} ${chip("info", newOnes + " new")} ${chip("mute", (f.items.length - newOnes) + " will be updated")}
            ${f.skipped.length ? chip("warn", f.skipped.length + " skipped") : ""}</div>
          ${f.skipped.length ? `<details class="sub" style="margin-top:6px"><summary>Show skipped rows</summary>${f.skipped.slice(0, 50).map(esc).join("<br>")}</details>` : ""}
          <div class="scroll" style="max-height:200px;min-height:0;margin-top:10px;border:1px solid var(--line);border-radius:9px"><table><thead><tr>${cols.map(c => `<th>${c.replace("_", " ")}</th>`).join("")}</tr></thead>
            <tbody>${f.items.slice(0, 8).map(x => `<tr>${cols.map(c => `<td>${esc(x[c] ?? "")}</td>`).join("")}</tr>`).join("")}
            ${f.items.length > 8 ? `<tr><td colspan="${cols.length}" class="sub">…and ${f.items.length - 8} more</td></tr>` : ""}</tbody></table></div>
          ${missing ? `<label class="sub" style="display:flex;gap:8px;align-items:center;margin-top:10px">
            <input type="checkbox" data-hide-missing="${f.type}" ${f.hideMissing ? "checked" : ""}>
            ${f.type === "books" ? `Hide the ${missing} book(s) that are in the system but <b>not</b> in this file (they disappear from the scan page)`
                                 : `Deactivate the ${missing} employee(s) that are in the system but <b>not</b> in this file (they can no longer issue books)`}</label>` : ""}
        </div>`;
      }
      html += `<div style="margin-top:14px;display:flex;gap:10px;align-items:center"><button class="btn primary" id="saveUpload">Save to database</button>
        <button class="btn" id="cancelUpload">Cancel</button><span class="sub" id="upStatus"></span></div>`;
    }
    html += `</div>`;
    $("view").innerHTML = html;

    const handle = async (file) => {
      if (!file) return;
      if (typeof XLSX === "undefined") { S.upload = { error: "The Excel reader did not load. Check your internet connection and refresh the page." }; return render(); }
      try {
        const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
        const found = [];
        for (const name of wb.SheetNames) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: false, blankrows: false });
          const d = detectSheet(name, rows);
          if (!d || found.some(f => f.type === d.type)) continue;
          const parsed = d.type === "books" ? parseBooks(d) : parseEmployees(d);
          if (parsed.items.length) found.push({ type: d.type, sheet: name, ...parsed, hideMissing: false });
        }
        S.upload = found.length ? { file: file.name, found }
          : { error: `No books or employees sheet was found in “${file.name}”. Check that the first row has headings like Book ID / Book, or Name / Email.` };
      } catch (e) { console.error(e); S.upload = { error: "Could not read this file: " + (e.message || e) }; }
      render();
    };
    $("file").addEventListener("change", (e) => handle(e.target.files[0]));
    const drop = $("drop");
    ["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
    drop.addEventListener("drop", (e) => { e.preventDefault(); handle(e.dataTransfer.files[0]); });
    document.querySelectorAll("[data-hide-missing]").forEach(cb => cb.addEventListener("change", () => {
      S.upload.found.find(f => f.type === cb.dataset.hideMissing).hideMissing = cb.checked;
    }));
    if ($("cancelUpload")) $("cancelUpload").addEventListener("click", () => { S.upload = null; render(); });
    if ($("saveUpload")) $("saveUpload").addEventListener("click", saveUpload);
  }

  async function saveUpload() {
    const btn = $("saveUpload"); btn.disabled = true;
    const status = (t) => { if ($("upStatus")) $("upStatus").textContent = t; };
    const summary = [];
    try {
      for (const f of S.upload.found) {
        const table = f.type === "books" ? "books" : "members", key = f.type === "books" ? "book_id" : "email";
        for (let i = 0; i < f.items.length; i += 500) {
          status(`Saving ${f.type}… ${Math.min(i + 500, f.items.length)}/${f.items.length}`);
          const { error } = await sb.from(table).upsert(f.items.slice(i, i + 500), { onConflict: key });
          if (error) throw new Error(`${f.type}: ${error.message}`);
        }
        let hidden = 0;
        if (f.hideMissing) {
          const inFile = new Set(f.items.map(x => x[key]));
          const missing = (f.type === "books" ? S.books.filter(b => b.active && !inFile.has(b.book_id)).map(b => b.book_id)
                                              : S.members.filter(m => m.active && !inFile.has(m.email)).map(m => m.email));
          for (let i = 0; i < missing.length; i += 100) {
            const { error } = await sb.from(table).update({ active: false }).in(key, missing.slice(i, i + 100));
            if (error) throw new Error(`${f.type}: ${error.message}`);
          }
          hidden = missing.length;
        }
        summary.push(`${f.items.length} ${f.type} saved${hidden ? `, ${hidden} ${f.type === "books" ? "hidden" : "deactivated"}` : ""}`);
      }
      S.upload = null;
      toast("Done: " + summary.join(" · "));
      await loadAll();
    } catch (e) {
      console.error(e); status("Failed: " + (e.message || e)); btn.disabled = false;
    }
  }

  // Settings
  function viewSettings() {
    const v = (k, d) => S.settings[k] ?? d;
    $("view").innerHTML = `<div class="panel" style="padding:20px;max-width:620px">
      <h3 style="margin:0 0 14px">Loan settings</h3>
      <label style="font-weight:600;display:block">Default loan period</label>
      <div class="sub" style="margin:2px 0 6px">Used for every new loan. You can still change any single loan in the Report tab (<b>Change days</b>).</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px"><input type="number" id="setLoan" min="1" max="365" value="${esc(v("default_loan_days", 15))}" style="width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px"><span class="sub">days</span></div>
      <label style="font-weight:600;display:block">Queue hold time</label>
      <div class="sub" style="margin:2px 0 6px">When a book comes back and someone is waiting, it is held for them this long. If they don't issue it in time, it passes to the next person.</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px"><input type="number" id="setHold" min="1" max="30" value="${esc(v("hold_days", 3))}" style="width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px"><span class="sub">days</span></div>
      <div class="sub" style="margin-bottom:16px;padding:10px 12px;background:#f7f8f5;border-radius:9px">Reminder emails for each loan: <b>halfway</b> through the period, <b>the day before</b> the return date, and <b>every 2nd day</b> once it's overdue.</div>
      <button class="btn primary" id="saveSettings">Save settings</button></div>`;
    $("saveSettings").addEventListener("click", async () => {
      const loan = Math.round(+$("setLoan").value), hold = Math.round(+$("setHold").value);
      if (!(loan >= 1 && loan <= 365) || !(hold >= 1 && hold <= 30)) return toast("Loan period 1–365 days, hold time 1–30 days");
      const { error } = await sb.from("settings").upsert([
        { key: "default_loan_days", value: String(loan), updated_at: new Date().toISOString() },
        { key: "hold_days", value: String(hold), updated_at: new Date().toISOString() }], { onConflict: "key" });
      if (error) return toast("Failed: " + error.message);
      toast("Settings saved"); loadAll();
    });
  }

  // Emails
  function viewEmails() {
    let rows = S.emails;
    if (S.filter !== "all") rows = rows.filter(e => e.status === S.filter);
    rows = rows.filter(match);
    $("view").innerHTML = toolbar([["all", "All emails"], ["sent", "Sent"], ["failed", "Failed"], ["skipped", "Not sent (emails off)"]]) + table(
      ["When", "To", "Subject", "Type", "Status"],
      rows.map(e => `<tr><td class="nowrap">${fmt(e.created_at)}</td><td>${esc(e.to_email)}</td><td>${esc(e.subject)}</td>
        <td class="sub">${esc(String(e.kind).replace(/_/g, " "))}</td>
        <td>${e.status === "sent" ? chip("ok", "Sent") : e.status === "skipped" ? chip("mute", "Not sent (emails off)") : chip("err", "Failed")}${e.error ? `<div class="sub">${esc(e.error)}</div>` : ""}</td></tr>`), "No emails yet.");
    wireToolbar(() => rows.map(e => ({ When: fmt(e.created_at), To: e.to_email, Subject: e.subject, Type: e.kind, Status: e.status, Error: e.error || "" })));
  }

  // QR
  function scanUrl() { return new URL("index.html", location.href).href.replace(/index\.html$/, ""); }
  function qrSvg(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); }
  function qrPng(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createDataURL(12, 4); }

  function viewQr() {
    const url = scanUrl();
    $("view").innerHTML = `<div class="panel"><div class="qr-wrap">
      <div class="qr-box printable" id="mainQr">${qrSvg(url)}<div class="cap">${esc(C.LIBRARY_NAME || "Library")}</div><div class="sub">Scan to issue or return a book</div></div>
      <div>
        <h3 style="margin-top:0">The scan page</h3>
        <p class="sub" style="font-size:14px">Print this QR code and stick it in the library. Anyone who scans it opens the page below, where they type their work email, choose <b>Issue</b> or <b>Return</b>, and pick the book.</p>
        <div class="url">${esc(url)}</div>
        <div class="toolbar" style="margin-top:12px">
          <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open scan page</a>
          <button class="btn" id="copyUrl">Copy link</button>
          <a class="btn" download="library-qr.png" href="${qrPng(url)}">Download PNG</a>
          <button class="btn primary" id="printQr">Print</button>
        </div>
        <p class="sub" style="font-size:14px;margin-top:18px">Tip: each book also has its own QR code (Books tab → <b>QR</b>). Stick it inside the cover, and scanning it opens the page with that book already selected.</p>
      </div></div></div>`;
    $("copyUrl").addEventListener("click", async () => { try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { toast(url); } });
    $("printQr").addEventListener("click", () => window.print());
  }

  function openQrModal(url, title, id) {
    $("modalBox").innerHTML = `${qrSvg(url)}<div style="font-weight:650;margin-top:8px">${esc(title)}</div><div class="sub">${esc(id)} · Scan to issue or return</div>
      <div class="toolbar" style="justify-content:center;margin:14px 0 0">
        <a class="btn" download="qr-${esc(id)}.png" href="${qrPng(url)}">Download</a>
        <button class="btn" onclick="window.print()">Print</button>
        <button class="btn primary" id="closeModal">Close</button></div>`;
    $("modal").classList.add("open");
    $("closeModal").addEventListener("click", () => $("modal").classList.remove("open"));
  }
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("open"); });

  // CSV
  function downloadCsv(rows, name) {
    if (!rows.length) return toast("Nothing to export");
    const cols = Object.keys(rows[0]);
    const cell = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const csv = "﻿" + [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library</title>
<meta name="theme-color" content="#16302a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17221e; --ink-2:#3c4a44; --muted:#6b7872; --line:#e4e7e1; --paper:#f7f5f0; --card:#fff;
    --brand:#16302a; --brand-2:#2d5a48; --brand-soft:#e9f1ec; --gold:#c08a3e;
    --ok:#1d7a4c; --ok-bg:#e5f4eb; --warn:#9a5b00; --warn-bg:#fdf0db; --err:#a3302a; --err-bg:#fbe8e6; --info:#285a8c; --info-bg:#e6eff9;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --r:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  img{display:block}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .hwrap{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;background:none;border:0;color:#fff;padding:0}
  .brand .mark{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
  .brand b{font-family:var(--serif);font-weight:650;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
  .search{flex:1;position:relative;max-width:620px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
  .search input{width:100%;padding:11px 14px 11px 42px;border-radius:999px;border:0;background:#fff;color:var(--ink);outline:none;font-size:15px}
  .search input:focus{box-shadow:0 0 0 3px rgba(192,138,62,.45)}
  .mybtn{position:relative;flex:none;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600}
  .mybtn:hover{background:rgba(255,255,255,.18)}
  .badge{min-width:20px;height:20px;border-radius:99px;background:var(--gold);color:#fff;font-size:12px;font-weight:700;display:none;place-items:center;padding:0 6px}
  .badge.on{display:grid}
  @media (max-width:640px){
    .hwrap{flex-wrap:wrap;gap:10px;padding:10px 14px}
    .search{order:3;flex-basis:100%;max-width:none}
    .brand b{font-size:16px}
    .mybtn span.lbl{display:none}
    .brand{flex:1}
  }

  main{max-width:1240px;margin:0 auto;padding:20px 18px 80px}
  .hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 16px}
  .hello h1{font-family:var(--serif);font-weight:650;font-size:28px;margin:0;letter-spacing:-.02em}
  .hello p{margin:4px 0 0;color:var(--muted)}
  .notice{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:none;cursor:pointer}
  .notice.on{display:block}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
  .chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:var(--muted);font-size:14px}
  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .toggle input{width:18px;height:18px;accent-color:var(--brand-2)}

  /* ---------- grid ---------- */
  .section-title{font-family:var(--serif);font-size:20px;font-weight:650;margin:22px 0 12px;letter-spacing:-.01em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
  .card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0}
  .card:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:8px}
  .cover{position:relative;aspect-ratio:2/3;border-radius:8px 10px 10px 8px;overflow:hidden;background:#e7e3da;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease}
  .card:hover .cover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,25,.08),0 14px 30px rgba(20,30,25,.14)}
  .cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
  .cover::after{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0))}
  .fallback{position:absolute;inset:0;padding:40px 14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
  .fallback .ft{font-family:var(--serif);font-weight:650;font-size:17px;line-height:1.2;letter-spacing:-.01em}
  .fallback .fa{font-size:12px;opacity:.85}
  .fallback .rule{width:28px;height:2px;background:rgba(255,255,255,.6);margin:10px 0}
  .tag{position:absolute;top:8px;left:8px;z-index:2;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.15);letter-spacing:.01em}
  .tag.ok{background:#fff;color:var(--ok)}
  .tag.out{background:rgba(23,34,30,.82);color:#fff}
  .tag.mine{background:var(--info);color:#fff}
  .tag.held{background:var(--gold);color:#fff}
  .tag.queue{background:var(--warn-bg);color:var(--warn)}
  .card .t{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .a{font-size:13px;color:var(--muted);margin-top:-5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .skeleton .cover{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}

  /* ---------- sheet (detail / checkout / done) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
  .scrim.on{display:flex}
  .sheet{background:var(--card);border-radius:18px;width:100%;max-width:820px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
  @media (max-width:640px){
    .scrim{padding:0;align-items:flex-end}
    .sheet{border-radius:18px 18px 0 0;max-height:94vh}
  }
  .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;place-items:center;z-index:3}
  .detail{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:28px}
  @media (max-width:640px){.detail{grid-template-columns:1fr;gap:18px;padding:22px 18px 18px}.detail .cover{width:100%;max-width:190px;margin:0 auto}}
  .detail h2{font-family:var(--serif);font-weight:650;font-size:27px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
  .detail .by{color:var(--muted);margin-bottom:14px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .meta span{font-size:12.5px;background:#f2f3ef;border-radius:99px;padding:4px 10px;color:var(--ink-2)}
  .status{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .status.ok{background:var(--ok-bg);color:var(--ok)}
  .status.warn{background:var(--warn-bg);color:#6e4300}
  .status.info{background:var(--info-bg);color:var(--info)}
  .desc{color:var(--ink-2);font-size:14.5px;line-height:1.6;margin-bottom:18px}
  .desc.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .more{background:none;border:0;color:var(--brand-2);font-weight:600;padding:0;margin:-10px 0 18px}
  .primary{width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:650;font-size:16px;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px}
  .primary:hover{background:#1e3f36}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .ghost{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;padding:13px}
  .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:none}
  .busy .spin{display:block}
  @keyframes s{to{transform:rotate(360deg)}}

  .checkout{padding:26px 28px 24px}
  @media (max-width:640px){.checkout{padding:22px 18px 18px}}
  .checkout h3{font-family:var(--serif);font-size:23px;margin:0 0 16px;font-weight:650}
  .summary{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
  .summary .cover{width:56px;flex:none;border-radius:4px 6px 6px 4px}
  .summary .fallback{padding:6px}.detail .fallback{padding:22px 18px}.summary .fallback .ft{font-size:8px}.summary .fallback .fa,.summary .fallback .rule{display:none}
  .summary b{display:block;font-weight:600}
  .summary small{color:var(--muted)}
  .lbl{font-weight:600;margin:0 0 8px;display:block}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff;text-align:left}
  .opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand-2);flex:none}
  .opt b{display:block;font-weight:600}
  .opt small{color:var(--muted);font-size:13px}
  .opt:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#fbfcfa}
  .opt.disabled{opacity:.5;cursor:not-allowed}
  .email-row input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fff}
  .email-row input:focus{border-color:var(--brand-2)}
  .email-row .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f4f6f2;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:18px}
  .who b{font-weight:600;word-break:break-all}
  .link{background:none;border:0;color:var(--brand-2);font-weight:600;padding:0;text-decoration:underline;white-space:nowrap}
  .alert{display:none;background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
  .alert.on{display:block}

  .done{padding:34px 28px 26px;text-align:center}
  .done .icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
  .done.ok .icon{background:var(--ok-bg);color:var(--ok)}
  .done.warn .icon{background:var(--warn-bg);color:var(--warn)}
  .done.err .icon{background:var(--err-bg);color:var(--err)}
  .done h3{font-family:var(--serif);font-size:24px;margin:0 0 8px;font-weight:650}
  .done p{color:var(--muted);max-width:430px;margin:0 auto 6px}
  .done .btns{display:grid;gap:10px;max-width:360px;margin:20px auto 0}

  /* ---------- My books ---------- */
  .back{background:none;border:0;color:var(--brand-2);font-weight:600;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .mb-h{font-family:var(--serif);font-size:28px;font-weight:650;margin:0 0 4px;letter-spacing:-.02em}
  .mb-sub{color:var(--muted);margin:0 0 20px}
  .row{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;align-items:center}
  .row .cover{width:78px;flex:none;border-radius:4px 6px 6px 4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .row .fallback{padding:7px}.cover::after{z-index:2}.row .fallback .ft{font-size:10px}.row .fallback .fa,.row .fallback .rule{display:none}
  .row .body{flex:1;min-width:0}
  .row .body b{display:block;font-weight:600;font-size:15.5px}
  .row .body small{color:var(--muted)}
  .row .actions{display:flex;flex-direction:column;gap:8px;flex:none}
  .row .actions button{border-radius:10px;padding:9px 14px;font-weight:600;border:1.5px solid var(--line);background:#fff;white-space:nowrap}
  .row .actions .go{background:var(--brand);border-color:var(--brand);color:#fff}
  @media (max-width:640px){.row{flex-wrap:wrap}.row .actions{flex-direction:row;flex-basis:100%}.row .actions button{flex:1}}
  .prog{height:6px;border-radius:99px;background:#eef0ec;overflow:hidden;margin:9px 0 5px}
  .prog i{display:block;height:100%;background:var(--brand-2);border-radius:99px}
  .prog.late i{background:var(--err)}
  .due{font-size:13px;font-weight:600}
  .due.late{color:var(--err)} .due.soon{color:var(--warn)} .due.fine{color:var(--ok)}
  .hist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hist div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid #f0f1ed;font-size:14px}
  .hist div:last-child{border-bottom:0}
  .hist span{color:var(--muted);white-space:nowrap}
  .ask{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;max-width:460px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90vw}
  .setup{background:var(--warn-bg);color:var(--warn);padding:14px;border-radius:10px;margin:20px auto;max-width:600px;display:none}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <button class="brand" id="home" aria-label="Library home">
      <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M8 7h7M8 11h5"/></svg></span>
      <b id="libName">Library</b>
    </button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17221e" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search books, authors, topics…" autocomplete="off" aria-label="Search books">
    </label>
    <button class="mybtn" id="myBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12l2 6H4l2-6Z"/><path d="M4 8h16v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8Z"/><path d="M9 12a3 3 0 0 0 6 0"/></svg>
      <span class="lbl">My books</span><span class="badge" id="myCount"></span>
    </button>
  </div>
</header>

<div class="setup" id="setupMsg">This page is not connected yet. Open <b>config.js</b> and paste your Supabase URL and key.</div>

<main id="store">
  <div class="hello">
    <div><h1 id="hi">Find your next read</h1><p id="hiSub">Browse the library, then check out to issue or return a book.</p></div>
  </div>
  <div class="notice" id="notice"></div>
  <div class="chips" id="chips"></div>
  <div class="bar"><span id="count"></span>
    <label class="toggle"><input type="checkbox" id="availOnly"> Available now</label></div>
  <div id="shelves"></div>
</main>

<main id="mine" hidden>
  <button class="back" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Back to library</button>
  <h2 class="mb-h">My books</h2>
  <p class="mb-sub" id="mbSub"></p>
  <div id="mbBody"></div>
</main>

<footer id="foot"></footer>

<div class="scrim" id="scrim" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(() => {
  const C = window.LIBRARY_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
    set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
    del(k){ try{ localStorage.removeItem(k) }catch{} },
  };
  const longDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
  const shortDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2800); };
  const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e || "");

  $("libName").textContent = C.LIBRARY_NAME || "Library";
  document.title = C.LIBRARY_NAME || "Library";
  const configured = C.SUPABASE_URL && !/YOUR-PROJECT/.test(C.SUPABASE_URL) && C.SUPABASE_ANON_KEY && !/PASTE/.test(C.SUPABASE_ANON_KEY);
  if (!configured) { $("setupMsg").style.display = "block"; return; }
  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false } });

  const S = { books: [], my: null, settings: { default_loan_days: 15, hold_days: 3 }, theme: "All", q: "", availOnly: false,
              email: store.get("lib_email") || "", loaded: false };
  const byId = (id) => S.books.find(b => b.book_id === id);

  // ---------------- data ----------------
  async function loadAll() {
    const email = validEmail(S.email) ? S.email : null;
    const [cat, mine, set] = await Promise.all([
      sb.rpc("store_catalog", { p_email: email }),
      email ? sb.rpc("my_books", { p_email: email }) : Promise.resolve({ data: null }),
      S.loaded ? Promise.resolve({ data: null }) : sb.rpc("public_settings"),
    ]);
    if (cat.error) { $("shelves").innerHTML = '<div class="empty">Could not load the library. Please refresh the page.</div>'; console.error(cat.error); return; }
    S.books = cat.data || [];
    S.my = mine.data || null;
    if (set.data && set.data[0]) S.settings = set.data[0];
    S.loaded = true;
    $("foot").textContent = (C.TEAM_NAME || "Library team") + " · Books are lent for " + S.settings.default_loan_days + " days";
    renderHeader(); renderStore();
    if (location.hash === "#my") renderMine();
  }

  // ---------------- covers ----------------
  const PALETTE = [["#1f4e45","#2f6f61"],["#6b2f3a","#8e4452"],["#2b3f6b","#3f5a93"],["#7a4b1c","#a26a2e"],["#3d4a2a","#5b6c3d"],["#4b2f63","#6a4789"],["#2a5560","#3b7684"],["#6a3b25","#8f5638"]];
  const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
  function fallback(b) {
    const [a, c] = PALETTE[hash(b.title || b.book_id) % PALETTE.length];
    return `<div class="fallback" style="background:linear-gradient(160deg,${a},${c})"><div><div class="ft">${esc(b.title)}</div><div class="rule"></div></div><div class="fa">${esc(String(b.author || "").trim())}</div></div>`;
  }
  function cover(b, tag = "") {
    const img = b.cover_url ? `<img src="${esc(b.cover_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
    return `<div class="cover">${fallback(b)}${img}${tag}</div>`;
  }
  function tagFor(b) {
    if (b.mine) return '<span class="tag mine">Reading</span>';
    if (b.held_for_me) return '<span class="tag held">Held for you</span>';
    if (b.available) return '<span class="tag ok">Available</span>';
    if (b.my_position) return `<span class="tag queue">In queue #${b.my_position}</span>`;
    if (b.is_out) return `<span class="tag out">Back ${esc(shortDate(b.due_date))}</span>`;
    return '<span class="tag out">Reserved</span>';
  }

  // ---------------- store view ----------------
  function renderHeader() {
    const n = S.my ? S.my.loans.length + S.my.queue.length : 0;
    $("myCount").textContent = n; $("myCount").classList.toggle("on", n > 0);
    const first = S.my && S.my.name ? S.my.name.split(" ")[0] : "";
    const h = new Date().getHours();
    $("hi").textContent = first ? `${h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"}, ${first}` : "Find your next read";
    const held = S.books.filter(b => b.held_for_me);
    const late = S.my ? S.my.loans.filter(l => new Date(l.due_date) < new Date()) : [];
    const note = $("notice");
    if (held.length) { note.innerHTML = `<b>📚 ${esc(held[0].title)}</b> is being held for you. Tap to issue it.`; note.onclick = () => openBook(held[0].book_id); note.classList.add("on"); }
    else if (late.length) { const b = byId(late[0].book_id) || { title: late[0].book_id }; note.innerHTML = `<b>${esc(b.title)}</b> is overdue – please return it. Tap to see your books.`; note.onclick = () => go("#my"); note.classList.add("on"); }
    else note.classList.remove("on");
  }

  function renderChips() {
    const themes = ["All", ...new Set(S.books.map(b => b.theme).filter(Boolean))];
    $("chips").innerHTML = themes.map(t => `<button class="chip" data-theme="${esc(t)}" aria-pressed="${t === S.theme}">${esc(t)}</button>`).join("");
    $("chips").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { S.theme = c.dataset.theme; renderStore(); }));
  }

  function renderStore() {
    renderChips();
    const q = S.q.trim().toLowerCase();
    let list = S.books.filter(b => (S.theme === "All" || b.theme === S.theme)
      && (!S.availOnly || b.available || b.held_for_me)
      && (!q || [b.title, b.author, b.theme, b.book_id].join(" ").toLowerCase().includes(q)));
    $("count").textContent = `${list.length} book${list.length === 1 ? "" : "s"}` + (q ? ` for “${S.q.trim()}”` : "");
    if (!list.length) { $("shelves").innerHTML = `<div class="empty">No books found${q ? ` for “${esc(S.q.trim())}”` : ""}.</div>`; return; }
    const cardHtml = (b) => `<button class="card" data-id="${esc(b.book_id)}" aria-label="${esc(b.title)}">${cover(b, tagFor(b))}<div class="t">${esc(b.title)}</div><div class="a">${esc(String(b.author || "").trim())}</div></button>`;
    if (S.theme === "All" && !q) {
      const groups = new Map();
      for (const b of list) { const t = b.theme || "Other"; if (!groups.has(t)) groups.set(t, []); groups.get(t).push(b); }
      $("shelves").innerHTML = [...groups].map(([t, items]) => `<div class="section-title">${esc(t)}</div><div class="grid">${items.map(cardHtml).join("")}</div>`).join("");
    } else {
      $("shelves").innerHTML = `<div class="grid">${list.map(cardHtml).join("")}</div>`;
    }
    $("shelves").querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openBook(c.dataset.id)));
  }

  $("q").addEventListener("input", () => { S.q = $("q").value; if (location.hash === "#my") go(""); renderStore(); });
  $("availOnly").addEventListener("change", () => { S.availOnly = $("availOnly").checked; renderStore(); });

  // ---------------- book sheet ----------------
  function openSheet(html) { $("sheet").innerHTML = html; $("scrim").classList.add("on"); document.body.style.overflow = "hidden"; $("sheet").scrollTop = 0; }
  function closeSheet() { $("scrim").classList.remove("on"); document.body.style.overflow = ""; }
  $("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  const xBtn = '<button class="x" aria-label="Close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  const wireClose = () => $("sheet").querySelectorAll("[data-close]").forEach(x => x.addEventListener("click", closeSheet));

  function statusLine(b) {
    const hd = S.settings.hold_days;
    if (b.mine) return ["info", `You have this book. Please return it by <b>${esc(longDate(b.due_date))}</b>.`];
    if (b.held_for_me) return ["ok", "<b>This book is being held for you.</b> Check out to issue it before the hold ends."];
    if (b.available) return ["ok", `<b>Available now.</b> Borrow it for ${S.settings.default_loan_days} days.`];
    if (b.my_position) return ["warn", `You're <b>number ${b.my_position}</b> in the queue. We'll email you when it's your turn.`];
    const waiting = b.queue_count ? ` ${b.queue_count} ${b.queue_count === 1 ? "person is" : "people are"} waiting.` : "";
    if (b.is_out) return ["warn", `<b>Currently issued</b> – expected back on <b>${esc(longDate(b.due_date))}</b>.${waiting} You can join the queue to get it next; it will then be held for you for ${hd} day${hd == 1 ? "" : "s"}.`];
    return ["warn", `<b>Reserved</b> – it's being held for the next person in the queue.${waiting} Join the queue to get it after them.`];
  }

  function openBook(id) {
    const b = byId(id); if (!b) return;
    const [cls, txt] = statusLine(b);
    const desc = (b.description || "").trim();
    openSheet(`${xBtn}<div class="detail">${cover(b)}<div>
      <h2>${esc(b.title)}</h2><div class="by">${esc(String(b.author || "").trim())}</div>
      <div class="meta"><span>${esc(b.theme || "General")}</span><span>Book ID: ${esc(b.book_id)}</span></div>
      <div class="status ${cls}">${txt}</div>
      ${desc ? `<div class="desc clamp" id="desc">${esc(desc)}</div>${desc.length > 380 ? '<button class="more" id="moreBtn">Read more</button>' : ""}` : ""}
      <button class="primary" id="toCheckout">Checkout</button>
    </div></div>`);
    wireClose();
    if ($("moreBtn")) $("moreBtn").addEventListener("click", () => { $("desc").classList.remove("clamp"); $("moreBtn").remove(); });
    $("toCheckout").addEventListener("click", () => openCheckout(id));
  }

  // Options shown at checkout
  function options(b) {
    const o = [];
    const issueOk = b.available || b.held_for_me;
    const due = new Date(Date.now() + S.settings.default_loan_days * 864e5);
    if (b.my_position && !b.held_for_me) {
      o.push({ v: "leave_queue", t: "Leave the queue", s: `You're number ${b.my_position}. Leave if you no longer need it.`, ok: true });
    } else if (!issueOk && !b.mine) {
      o.push({ v: "reserve", t: "Join the queue", s: b.is_out ? `Back around ${longDate(b.due_date)}. We'll email you when it's your turn.` : "We'll email you when it's your turn.", ok: true });
    }
    o.push({ v: "issue", t: "Issue this book", ok: issueOk,
      s: issueOk ? `Borrow for ${S.settings.default_loan_days} days · return by ${longDate(due)}`
        : b.mine ? "You already have this book" : b.is_out ? `Currently issued – back ${longDate(b.due_date)}` : "Held for someone in the queue" });
    o.push({ v: "return", t: "Return this book", ok: !!b.mine,
      s: b.mine ? `Due ${longDate(b.due_date)}` : "Only if you currently have it" });
    if (b.held_for_me) o.push({ v: "leave_queue", t: "I don't need it any more", s: "Pass it to the next person in the queue", ok: true });
    return o;
  }

  function openCheckout(id, preferred) {
    const b = byId(id); if (!b) return;
    const opts = options(b);
    const pick = (preferred && opts.find(o => o.v === preferred && o.ok)) || opts.find(o => o.ok);
    const hasEmail = validEmail(S.email);
    openSheet(`${xBtn}<div class="checkout">
      <h3>Checkout</h3>
      <div class="summary">${cover(b)}<div><b>${esc(b.title)}</b><small>${esc(String(b.author || "").trim())} · ${esc(b.book_id)} · ${esc(b.theme || "")}</small></div></div>
      ${hasEmail ? `<div class="who"><span>Checking out as <b>${esc(S.email)}</b></span><button class="link" id="notMe">Not you?</button></div>`
        : `<div class="email-row" style="margin-bottom:18px"><label class="lbl" for="emailIn">Your work email</label>
           <input type="email" id="emailIn" inputmode="email" autocomplete="email" placeholder="${esc(C.EMAIL_HINT || "name@company.com")}">
           <div class="hint">Asked only once – this phone will remember it.</div></div>`}
      <span class="lbl">What would you like to do?</span>
      <div class="opts">${opts.map(o => `<label class="opt ${o.ok ? "" : "disabled"}"><input type="radio" name="act" value="${o.v}" ${o.ok ? "" : "disabled"} ${pick && pick.v === o.v ? "checked" : ""}>
        <span><b>${esc(o.t)}</b><small>${esc(o.s)}</small></span></label>`).join("")}</div>
      <div class="alert" id="coAlert"></div>
      <button class="primary" id="confirm"><span class="spin"></span><span id="confirmTxt">Confirm</span></button>
      <button class="ghost" style="margin-top:10px" id="backToBook">Back</button>
    </div>`);
    wireClose();
    const labels = { issue: "Confirm issue", return: "Confirm return", reserve: "Join the queue", leave_queue: "Leave the queue" };
    const sync = () => {
      const v = (document.querySelector('input[name=act]:checked') || {}).value;
      $("confirmTxt").textContent = labels[v] || "Confirm";
      const e = hasEmail ? S.email : ($("emailIn")?.value || "").trim();
      $("confirm").disabled = !v || !validEmail(e);
    };
    document.querySelectorAll("input[name=act]").forEach(r => r.addEventListener("change", sync));
    if ($("emailIn")) { $("emailIn").addEventListener("input", sync); setTimeout(() => $("emailIn").focus(), 50); }
    if ($("notMe")) $("notMe").addEventListener("click", () => { S.email = ""; store.del("lib_email"); S.my = null; renderHeader(); openCheckout(id, preferred); });
    $("backToBook").addEventListener("click", () => openBook(id));
    $("confirm").addEventListener("click", () => {
      const v = (document.querySelector('input[name=act]:checked') || {}).value;
      const e = (hasEmail ? S.email : $("emailIn").value).trim().toLowerCase();
      if (v && validEmail(e)) submit(v, b, e);
    });
    sync();
  }

  const icons = {
    ok: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    warn: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
    err: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  };
  const titles = {
    issued: ["ok", "Enjoy your book!"], returned: ["ok", "Book returned"], queued: ["ok", "You're in the queue"],
    left_queue: ["ok", "You've left the queue"], already_issued: ["warn", "Book already issued"], reserved: ["warn", "Book is reserved"],
    own_book: ["warn", "You already have this book"], already_in_queue: ["warn", "Already in the queue"], available_now: ["ok", "It's available now"],
    already_returned: ["warn", "Already returned"], no_record: ["warn", "No borrowing record"], not_in_queue: ["warn", "Not in the queue"],
    error: ["err", "Something went wrong"],
  };

  async function submit(action, b, email) {
    const btn = $("confirm"); btn.disabled = true; btn.classList.add("busy"); $("coAlert").classList.remove("on");
    try {
      const res = await fetch(C.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/library-action", {
        method: "POST", headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, action, book_id: b.book_id }),
      });
      const out = await res.json().catch(() => ({}));
      if (out.outcome === "unknown_user") {
        S.email = ""; store.del("lib_email");
        $("coAlert").textContent = out.message; $("coAlert").classList.add("on");
        if (!$("emailIn")) { openCheckout(b.book_id, action); $("coAlert").textContent = out.message; $("coAlert").classList.add("on"); }
        return;
      }
      if (!out.outcome) { $("coAlert").textContent = out.message || "Something went wrong. Please try again."; $("coAlert").classList.add("on"); return; }
      S.email = email; store.set("lib_email", email);
      const [kind, title] = titles[out.outcome] || ["err", "Something went wrong"];
      openSheet(`${xBtn}<div class="done ${kind}"><div class="icon">${icons[kind]}</div><h3>${esc(title)}</h3>
        <p>${esc(out.message || "")}</p>
        ${out.email === "sent" ? `<p style="font-size:13.5px">A confirmation email has been sent to ${esc(email)}.</p>` : ""}
        <div class="btns">${out.can_queue ? '<button class="primary" id="joinNow">Join the queue</button>' : ""}
          <button class="${out.can_queue ? "ghost" : "primary"}" id="toMine">Go to My books</button>
          <button class="ghost" id="keep">Keep browsing</button></div></div>`);
      wireClose();
      $("toMine").addEventListener("click", () => { closeSheet(); go("#my"); });
      $("keep").addEventListener("click", () => { closeSheet(); go(""); });
      if ($("joinNow")) $("joinNow").addEventListener("click", async () => { await loadAll(); openCheckout(b.book_id, "reserve"); });
      loadAll();
    } catch (err) {
      console.error(err);
      $("coAlert").textContent = "Could not reach the library system. Check your internet connection and try again.";
      $("coAlert").classList.add("on");
    } finally {
      if ($("confirm")) { $("confirm").classList.remove("busy"); $("confirm").disabled = false; }
    }
  }

  // ---------------- My books ----------------
  function dueInfo(l) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(l.due_date); due.setHours(0, 0, 0, 0);
    const left = Math.round((due - today) / 864e5);
    const total = l.loan_days || S.settings.default_loan_days;
    const pct = Math.max(4, Math.min(100, ((total - Math.max(left, 0)) / total) * 100));
    if (left < 0) return { cls: "late", txt: `${-left} day${left === -1 ? "" : "s"} overdue`, pct: 100 };
    if (left === 0) return { cls: "soon", txt: "Due today", pct };
    if (left === 1) return { cls: "soon", txt: "Due tomorrow", pct };
    return { cls: left <= 3 ? "soon" : "fine", txt: `${left} days left`, pct };
  }

  function renderMine() {
    $("store").hidden = true; $("mine").hidden = false; window.scrollTo(0, 0);
    if (!validEmail(S.email)) {
      $("mbSub").textContent = "Enter your work email to see the books you have and your place in any queue.";
      $("mbBody").innerHTML = `<div class="ask email-row"><label class="lbl" for="askEmail">Your work email</label>
        <input type="email" id="askEmail" inputmode="email" autocomplete="email" placeholder="${esc(C.EMAIL_HINT || "name@company.com")}">
        <button class="primary" id="askGo" style="margin-top:12px">Show my books</button></div>`;
      $("askGo").addEventListener("click", async () => {
        const e = $("askEmail").value.trim().toLowerCase();
        if (!validEmail(e)) return toast("Please enter a valid email");
        const { data } = await sb.rpc("my_books", { p_email: e });
        if (!data || !data.on_staff_list) return toast("That email is not on the staff list");
        S.email = e; store.set("lib_email", e); loadAll();
      });
      return;
    }
    const my = S.my || { loans: [], queue: [], history: [] };
    $("mbSub").innerHTML = `${esc(my.name || S.email)} · <button class="link" id="switchUser">Not you?</button>`;
    let html = "";
    html += `<div class="section-title">Currently reading</div>`;
    html += my.loans.length ? my.loans.map(l => {
      const b = byId(l.book_id) || { book_id: l.book_id, title: l.book_id, author: "", theme: "" };
      const d = dueInfo(l);
      return `<div class="row">${cover(b)}<div class="body"><b>${esc(b.title)}</b><small>${esc(String(b.author || "").trim())} · ${esc(b.book_id)}</small>
        <div class="prog ${d.cls === "late" ? "late" : ""}"><i style="width:${d.pct}%"></i></div>
        <span class="due ${d.cls}">${d.txt}</span> <small>· Return by ${esc(longDate(l.due_date))}</small></div>
        <div class="actions"><button class="go" data-ret="${esc(l.book_id)}">Return</button><button data-view="${esc(l.book_id)}">View</button></div></div>`;
    }).join("") : `<div class="empty" style="padding:24px">You don't have any books right now. <button class="link" data-browse>Browse the library</button></div>`;
    if (my.queue.length) {
      html += `<div class="section-title">Your queue</div>` + my.queue.map(r => {
        const b = byId(r.book_id) || { book_id: r.book_id, title: r.book_id, author: "", theme: "" };
        const held = r.status === "notified";
        return `<div class="row">${cover(b)}<div class="body"><b>${esc(b.title)}</b><small>${esc(String(b.author || "").trim())} · ${esc(b.book_id)}</small>
          <div style="margin-top:8px">${held ? `<span class="due fine">Held for you until ${esc(longDate(r.hold_until))}</span>`
            : `<span class="due soon">Number ${r.position} in the queue</span>${b.is_out ? ` <small>· back around ${esc(longDate(b.due_date))}</small>` : ""}`}</div></div>
          <div class="actions">${held ? `<button class="go" data-issue="${esc(r.book_id)}">Issue now</button>` : ""}<button data-leave="${esc(r.book_id)}">Leave queue</button></div></div>`;
      }).join("");
    }
    if (my.history.length) {
      html += `<div class="section-title">Recently returned</div><div class="hist">` + my.history.map(h => {
        const b = byId(h.book_id) || { title: h.book_id };
        return `<div><b style="font-weight:500">${esc(b.title)}</b><span>${esc(shortDate(h.issue_date))} – ${esc(shortDate(h.return_date))}</span></div>`;
      }).join("") + "</div>";
    }
    $("mbBody").innerHTML = html;
    $("switchUser").addEventListener("click", () => { S.email = ""; store.del("lib_email"); S.my = null; renderHeader(); renderMine(); });
    $("mbBody").querySelectorAll("[data-ret]").forEach(x => x.addEventListener("click", () => openCheckout(x.dataset.ret, "return")));
    $("mbBody").querySelectorAll("[data-issue]").forEach(x => x.addEventListener("click", () => openCheckout(x.dataset.issue, "issue")));
    $("mbBody").querySelectorAll("[data-leave]").forEach(x => x.addEventListener("click", () => openCheckout(x.dataset.leave, "leave_queue")));
    $("mbBody").querySelectorAll("[data-view]").forEach(x => x.addEventListener("click", () => openBook(x.dataset.view)));
    $("mbBody").querySelectorAll("[data-browse]").forEach(x => x.addEventListener("click", () => go("")));
  }

  // ---------------- navigation ----------------
  function go(hash) { if (location.hash !== hash) history.pushState(null, "", hash || location.pathname + location.search); route(); }
  function route() {
    if (location.hash === "#my") renderMine();
    else { $("mine").hidden = true; $("store").hidden = false; }
  }
  window.addEventListener("popstate", route);
  $("myBtn").addEventListener("click", () => go("#my"));
  $("backBtn").addEventListener("click", () => go(""));
  $("home").addEventListener("click", () => { S.q = ""; $("q").value = ""; S.theme = "All"; go(""); renderStore(); });

  // skeleton while loading
  $("shelves").innerHTML = `<div class="grid skeleton">${'<div class="card"><div class="cover"></div></div>'.repeat(10)}</div>`;
  loadAll().then(() => {
    route();
    const pre = new URLSearchParams(location.search).get("book");   // QR sticker inside a book
    if (pre && byId(pre)) openBook(pre);
  });
  // keep availability fresh when people come back to the tab
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("scrim").classList.contains("on")) loadAll(); });
})();
</script>
</body>
</html>
